[project]
name = "cas-agent-runtime"
version = "0.1.0"
description = "CAS direct Claude Agent SDK task and scenario runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk==0.2.165", "jsonschema>=4.20,<5"]

[project.scripts]
cas-cli = "agent_runtime.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.hatch.build.targets.sdist.force-include]
"src/agent_runtime/providers/claude/working_cells/metadata" = "src/agent_runtime/providers/claude/working_cells/metadata"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_runtime"]

[tool.ruff.lint.per-file-ignores]
# Historical controller source kept verbatim; test_working_lifecycle parses and patches it.
"tests/fixtures/*" = ["E", "F", "I", "B", "UP"]
# Reviewed source bytes/line references are pinned in tools/finite-observability reviews;
# keep their compact style rather than reformatting for lint.
"src/agent_runtime/tasks/finite_projection.py" = ["E701", "E702"]
"src/agent_runtime/tasks/working_sessions.py" = ["E701", "E702", "F841", "I001"]
